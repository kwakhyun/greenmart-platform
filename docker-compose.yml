services:
  postgres:
    image: postgres:16-alpine
    container_name: greenmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenmart
      POSTGRES_PASSWORD: greenmart
      POSTGRES_DB: greenmart
    ports:
      - "5432:5432"
    volumes:
      - greenmart_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenmart -d greenmart"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  greenmart_postgres_data:
